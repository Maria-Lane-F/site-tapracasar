<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum do Evento</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding-bottom: 50px;
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        p.desc {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        .btn-upload {
            background-color: #e91e63;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 15px;
        }
        .btn-upload:active {
            transform: scale(0.98);
        }
        .btn-upload:hover {
            background-color: #d81b60;
        }
        .counter {
            font-size: 13px;
            color: #888888;
            margin-bottom: 30px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            border-radius: 12px;
            overflow: hidden;
        }
        .gallery-item {
            aspect-ratio: 1;
            background-color: #222;
            overflow: hidden;
            position: relative;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #4CAF50;
            display: none;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="event-title">Carregando...</h1>
        <p class="desc" id="event-desc">Aguarde um instante...</p>

        <button class="btn-upload" onclick="document.getElementById('file-input').click()">+ Enviar foto ou vídeo</button>
        <input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files)">

        <div id="status-msg">A enviar fotografia... Por favor, aguarde.</div>

        <div class="counter" id="photo-counter">A carregar galeria...</div>

        <div class="gallery-grid" id="gallery"></div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const title = getQueryParam('title') || "Nosso Álbum";
        const desc = getQueryParam('desc') || "Compartilhe suas fotos conosco!";
        const titleColor = getQueryParam('tcol') || "#ffffff";
        const textColor = getQueryParam('col') || "#cccccc";
        
        const scriptBase64 = getQueryParam('script');
        const folderBase64 = getQueryParam('folder');

        const SCRIPT_URL = scriptBase64 ? atob(scriptBase64) : "";
        const FOLDER_ID = folderBase64 ? atob(folderBase64) : "";

        document.getElementById('event-title').innerText = title;
        document.getElementById('event-title').style.color = titleColor;
        
        document.getElementById('event-desc').innerText = desc;
        document.getElementById('event-desc').style.color = textColor;

        window.onload = function() {
            loadGallery();
        };

        function loadGallery() {
            if (!SCRIPT_URL) {
                document.getElementById('photo-counter').innerText = "Link do Script não configurado";
                return;
            }

            const payload = {
                action: "list",
                folderId: FOLDER_ID
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    const photos = data.photos;
                    const galleryEl = document.getElementById('gallery');
                    const counterEl = document.getElementById('photo-counter');
                    
                    galleryEl.innerHTML = "";
                    counterEl.innerText = `${photos.length} fotografias`;

                    if (photos.length === 0) {
                        counterEl.innerText = "Nenhuma fotografia enviada ainda. Seja o primeiro!";
                    }

                    photos.forEach(photo => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        item.innerHTML = `<img src="${photo.url}" loading="lazy" alt="Foto">`;
                        galleryEl.appendChild(item);
                    });
                } else {
                    document.getElementById('photo-counter').innerText = "Erro ao carregar fotografias do servidor";
                }
            })
            .catch(err => {
                console.error("Erro ao carregar galeria:", err);
                document.getElementById('photo-counter').innerText = "Erro de conexão com o álbum";
            });
        }

        function handleFiles(files) {
            if (files.length === 0) return;

            const statusMsg = document.getElementById('status-msg');
            statusMsg.style.display = 'block';
            statusMsg.innerText = `A enviar ${files.length} fotografia(s)...`;

            let uploadedCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = function(e) {
                    const base64Data = e.target.result.split(',')[1];
                    
                    const payload = {
                        filename: file.name,
                        mimeType: file.type,
                        data: base64Data,
                        guestName: "Convidado",
                        folderId: FOLDER_ID
                    };

                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(resData => {
                        uploadedCount++;
                        if (uploadedCount === files.length) {
                            statusMsg.innerText = "Fotografias enviadas com sucesso!";
                            setTimeout(() => {
                                statusMsg.style.display = 'none';
                                loadGallery(); 
                            }, 1500);
                        }
                    })
                    .catch(error => {
                        console.error('Erro:', error);
                        statusMsg.innerText = "Erro ao enviar fotografia.";
                    });
                };

                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
