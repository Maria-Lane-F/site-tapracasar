<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title_meta">Álbum Digital</title>
    <style>
        body {
            background: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: rgba(30, 30, 30, 0.95);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }
        .brand {
            font-size: 11px;
            letter-spacing: 2px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p.desc {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaaaaa;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #dddddd;
        }
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        #status_msg {
            margin-top: 20px;
            font-size: 13px;
            display: none;
            padding: 10px;
            border-radius: 6px;
            background: #222;
        }
        #status_msg.error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        #status_msg.success {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">TaPraCasar • Álbum Digital</div>
        <h1 id="event_title_display">Carregando evento...</h1>
        <p class="desc" id="event_desc_display">Aguarde um instante.</p>

        <div class="form-group">
            <label id="label_name">Seu Nome (Opcional)</label>
            <input type="text" id="guest_name" placeholder="Como quer assinar as fotos?">
        </div>

        <div class="form-group">
            <label id="label_file">Escolha as Fotos (várias permitidas)</label>
            <!-- ADICIONADO O ATRIBUTO "multiple" AQUI -->
            <input type="file" id="photo_input" accept="image/*" multiple>
        </div>

        <button id="upload_btn" onclick="uploadPhotos()">Enviar Fotos</button>
        
        <div id="status_msg"></div>
    </div>

    <script>
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        window.onload = function() {
            const title = getUrlParameter('title');
            const desc = getUrlParameter('desc');
            const bg = getUrlParameter('bg');
            const tcol = getUrlParameter('tcol');
            const col = getUrlParameter('col');

            if (title) {
                document.getElementById('event_title_display').innerText = title;
                document.getElementById('page_title_meta').innerText = title;
            } else {
                document.getElementById('event_title_display').innerText = 'Casamento Exemplo';
            }

            if (desc) {
                document.getElementById('event_desc_display').innerText = desc;
            } else {
                document.getElementById('event_desc_display').innerText = 'Envie suas fotos favoritas da nossa celebração!';
            }

            if (bg) {
                document.body.style.setProperty('background-color', bg, 'important');
            }
            if (tcol) {
                document.getElementById('event_title_display').style.setProperty('color', tcol, 'important');
            }
            if (col) {
                document.getElementById('event_desc_display').style.setProperty('color', col, 'important');
                document.getElementById('label_name').style.setProperty('color', col, 'important');
                document.getElementById('label_file').style.setProperty('color', col, 'important');
            }
        };

        async function uploadPhotos() {
            const fileInput = document.getElementById('photo_input');
            const guestName = document.getElementById('guest_name').value.trim() || 'Convidado Anônimo';
            const statusMsg = document.getElementById('status_msg');
            const uploadBtn = document.getElementById('upload_btn');

            const encodedScript = getUrlParameter('script');
            const encodedFolder = getUrlParameter('folder');

            if (!encodedScript) {
                statusMsg.style.display = 'block';
                statusMsg.className = 'error';
                statusMsg.innerText = 'Erro: Link do script não configurado.';
                return;
            }

            const scriptUrl = atob(encodedScript);
            const folderId = encodedFolder ? atob(encodedFolder) : '';

            if (fileInput.files.length === 0) {
                alert('Por favor, escolha pelo menos uma foto antes de enviar.');
                return;
            }

            const totalFiles = fileInput.files.length;
            uploadBtn.disabled = true;
            statusMsg.style.display = 'block';
            statusMsg.className = '';

            let successCount = 0;

            // Loop para enviar cada foto selecionada uma a uma de forma organizada
            for (let i = 0; i < totalFiles; i++) {
                const file = fileInput.files[i];
                uploadBtn.innerText = `Enviando ${i + 1} de ${totalFiles}...`;
                statusMsg.innerText = `Enviando foto ${i + 1} de ${totalFiles} (${file.name})...`;

                try {
                    await sendSingleFile(file, guestName, scriptUrl, folderId);
                    successCount++;
                } catch (error) {
                    console.error('Erro ao enviar o arquivo:', file.name, error);
                }
            }

            // Finalização do lote
            uploadBtn.disabled = false;
            uploadBtn.innerText = 'Enviar Fotos';
            fileInput.value = '';
            document.getElementById('guest_name').value = '';

            if (successCount === totalFiles) {
                statusMsg.className = 'success';
                statusMsg.innerText = `Sucesso! Todas as ${totalFiles} fotos foram enviadas com carinho.`;
            } else {
                statusMsg.className = 'error';
                statusMsg.innerText = `Envio concluído: ${successCount} de ${totalFiles} fotos enviadas com sucesso.`;
            }
        }

        // Função auxiliar que converte e envia um arquivo individual via fetch
        function sendSingleFile(file, guestName, scriptUrl, folderId) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function () {
                    const base64Data = reader.result.split(',')[1];
                    
                    const payload = {
                        filename: file.name,
                        mimeType: file.type,
                        data: base64Data,
                        guestName: guestName,
                        folderId: folderId
                    };

                    fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(() => resolve())
                    .catch(error => reject(error));
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
