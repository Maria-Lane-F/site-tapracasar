<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador • TaPraCasar</title>
    <style>
        body {
            background: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: rgba(30, 30, 30, 0.95);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .brand {
            font-size: 11px;
            letter-spacing: 2px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 14px;
            color: #4CAF50;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-top: 25px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaaaaa;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .color-row {
            display: flex;
            gap: 15px;
        }
        .color-group {
            flex: 1;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
            cursor: pointer;
            padding: 2px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .radio-group label {
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }
        button:hover {
            background: #dddddd;
        }
        #result_area {
            margin-top: 25px;
            padding: 15px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            display: none;
            word-break: break-all;
            text-align: left;
        }
        #result_area p {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: #aaa;
        }
        #final_link {
            color: #4CAF50;
            font-size: 13px;
            text-decoration: none;
        }
        #final_link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">TaPraCasar • Painel Admin</div>
        <h1>Configuração do Evento</h1>
        
        <div class="section-title">1. Informações da Página</div>
        <div class="form-group">
            <label>Título do Evento</label>
            <input type="text" id="event_title" placeholder="Ex: Casamento Ana & Bruno" value="Evento TaPraCasar">
        </div>
        <div class="form-group">
            <label>Subtítulo / Descrição</label>
            <textarea id="event_desc" placeholder="Mensagem para os convidados...">Ajude a compor a Arte Eterna deste dia. Compartilhe os momentos capturados pelo seu olhar.</textarea>
        </div>

        <div class="section-title">2. Personalização Visual</div>
        <div class="color-row">
            <div class="form-group color-group">
                <label>Cor do Título</label>
                <input type="color" id="title_color" value="#ffffff">
            </div>
            <div class="form-group color-group">
                <label>Cor do Texto</label>
                <input type="color" id="text_color" value="#cccccc">
            </div>
            <div class="form-group color-group">
                <label>Cor do Botão</label>
                <input type="color" id="button_color" value="#e91e63">
            </div>
        </div>

        <div class="section-title">3. Destino das Fotos (Google Drive)</div>
        <div class="radio-group">
            <label><input type="radio" name="account_type" value="minha" checked onclick="toggleAccountType()"> Minha Conta (Gratuito/Teste)</label>
            <label><input type="radio" name="account_type" value="cliente" onclick="toggleAccountType()"> Conta do Cliente (Whitelabel)</label>
        </div>

        <div class="form-group">
            <label id="script_label">Link do Web App (Google Apps Script)</label>
            <input type="text" id="script_url" value="https://script.google.com/macros/s/AKfycbza77Mc5R9JSbM1KuACetaX_ga1vIurK4Y_GTqPuHi9XJJlnK_fdYVKIFj1N5t9kiZB/exec">
        </div>

        <div class="form-group" id="folder_field_container">
            <label>ID da Pasta do Google Drive</label>
            <input type="text" id="folder_id" placeholder="ID que fica na URL da pasta do Drive">
        </div>

        <div class="section-title">4. Registo Automático (Planilha Google)</div>
        <div class="form-group">
            <label>ID da Planilha de Controlo (Opcional)</label>
            <input type="text" id="sheet_id" placeholder="Cole o ID da sua Google Sheet para guardar os clientes gerados">
        </div>

        <button onclick="generateLink()">Gerar Link Personalizado</button>

        <div id="result_area">
            <p><strong>Link gerado com sucesso! Copie ou abra abaixo:</strong></p>
            <a id="final_link" href="#" target="_blank"></a>
            <p id="save_status" style="margin-top: 10px; color: #4CAF50; font-size: 12px; display: none;"></p>
        </div>
    </div>

    <script>
        const MEU_SCRIPT_PADRAO = "https://script.google.com/macros/s/AKfycbza77Mc5R9JSbM1KuACetaX_ga1vIurK4Y_GTqPuHi9XJJlnK_fdYVKIFj1N5t9kiZB/exec"; 

        function toggleAccountType() {
            const type = document.querySelector('input[name="account_type"]:checked').value;
            const scriptInput = document.getElementById('script_url');
            const scriptLabel = document.getElementById('script_label');
            const folderContainer = document.getElementById('folder_field_container');

            if (type === 'minha') {
                scriptLabel.innerText = "Link do Web App (Google Apps Script)";
                scriptInput.value = MEU_SCRIPT_PADRAO; 
                folderContainer.style.display = 'block'; 
            } else {
                scriptLabel.innerText = "Link do Web App Exclusivo do Cliente";
                scriptInput.value = ""; 
                folderContainer.style.display = 'none'; 
            }
        }

        function generateLink() {
            const title = document.getElementById('event_title').value.trim();
            const desc = document.getElementById('event_desc').value.trim();
            const titleColor = document.getElementById('title_color').value;
            const textColor = document.getElementById('text_color').value;
            const buttonColor = document.getElementById('button_color').value;
            
            const type = document.querySelector('input[name="account_type"]:checked').value;
            const scriptUrl = document.getElementById('script_url').value.trim();
            const folderId = document.getElementById('folder_id').value.trim();
            const sheetId = document.getElementById('sheet_id').value.trim();

            if (!scriptUrl) {
                alert('Por favor, preencha o Link do Web App.');
                return;
            }

            if (type === 'minha' && !folderId) {
                alert('Por favor, preencha o ID da Pasta do Google Drive.');
                return;
            }

            // Monta o link incluindo o parâmetro de cor do botão (&bcol=)
            let finalUrl = `enviar.html?title=${encodeURIComponent(title)}&desc=${encodeURIComponent(desc)}&tcol=${encodeURIComponent(titleColor)}&col=${encodeURIComponent(textColor)}&bcol=${encodeURIComponent(buttonColor)}&script=${btoa(scriptUrl)}`;
            
            if (type === 'minha' && folderId) {
                finalUrl += `&folder=${btoa(folderId)}`;
            }

            const linkElement = document.getElementById('final_link');
            linkElement.href = finalUrl;
            linkElement.innerText = "Abrir Página do Convidado Personalizada";
            
            const resultArea = document.getElementById('result_area');
            const saveStatus = document.getElementById('save_status');
            resultArea.style.display = 'block';
            saveStatus.style.display = 'none';

            // Se o ID da planilha foi preenchido, envia os dados para guardar automaticamente
            if (sheetId) {
                saveStatus.style.display = 'block';
                saveStatus.innerText = "A guardar cliente na planilha Google...";

                const payload = {
                    action: "save_client",
                    sheetId: sheetId,
                    eventName: title,
                    folderId: folderId || "Exclusivo do Cliente",
                    eventLink: finalUrl,
                    buttonColor: buttonColor
                };

                fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        saveStatus.innerText = "✓ Cliente guardado com sucesso na planilha!";
                    } else {
                        saveStatus.innerText = "Aviso: " + data.message;
                    }
                })
                .catch(err => {
                    console.error("Erro ao guardar na planilha:", err);
                    saveStatus.innerText = "Erro ao comunicar com o servidor para guardar na planilha.";
                });
            }
        }
    </script>
</body>
</html>
